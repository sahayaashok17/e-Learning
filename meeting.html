<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Join the TOTC UX/UI Design conference meeting.">
  <title>TOTC | UX/UI Design Conference</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

  <style>
    :root {
      --navy: #1d2855;
      --navy-dark: #172044;
      --purple: #6c63ff;
      --purple-dark: #5148dc;
      --ink: #252b42;
      --muted: #697386;
      --soft: #f5f6ff;
      --line: #e8eaf2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      color: var(--ink);
      background: #f4f6ff;
      font-family: "Inter", sans-serif;
    }

    .meeting-page {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 42px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .back-button {
      display: inline-grid;
      place-items: center;
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      color: var(--navy);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 1.15rem;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(29, 40, 85, .05);
      transition: .2s ease;
    }

    .back-button:hover {
      color: #fff;
      background: var(--purple);
      border-color: var(--purple);
      transform: translateX(-2px);
    }

    .course-summary {
      flex: 1;
      min-width: 0;
      padding: 22px 26px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(29, 40, 85, .06);
    }

    .course-heading-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .course-title {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1.25;
    }

    .course-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: .9rem;
      list-style: none;
    }

    .course-meta li {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .course-meta i { color: var(--purple); }

    .settings-button {
      display: inline-grid;
      place-items: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      color: var(--purple-dark);
      background: #f0efff;
      border: 0;
      border-radius: 12px;
      font-size: 1.1rem;
      transition: .2s ease;
    }

    .settings-button:hover {
      color: #fff;
      background: var(--purple);
    }

    .meeting-frame {
      overflow: hidden;
      padding: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(29, 40, 85, .10);
    }

    .meeting-image {
      display: block;
      width: 100%;
      height: min(68vh, 680px);
      min-height: 320px;
      object-fit: cover;
      object-position: center;
      border-radius: 15px;
    }

    .meeting-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 10px 6px;
    }

    .caption-title {
      margin: 0;
      color: var(--navy);
      font-size: .95rem;
      font-weight: 700;
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #23865b;
      font-size: .82rem;
      font-weight: 600;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #27ae72;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(39, 174, 114, .12);
    }

    @media (max-width: 767.98px) {
      .meeting-page {
        width: min(100% - 28px, 640px);
        padding-top: 24px;
      }
      .topbar { align-items: flex-start; gap: 12px; }
      .back-button { flex-basis: 42px; width: 42px; height: 42px; }
      .course-summary { padding: 18px; }
      .meeting-image { height: 55vh; min-height: 260px; }
    }

    @media (max-width: 480px) {
      .course-heading-row { gap: 10px; }
      .course-title { font-size: 1.12rem; }
      .course-meta { gap: 8px 14px; font-size: .82rem; }
      .settings-button { flex-basis: 36px; width: 36px; height: 36px; }
      .meeting-frame { padding: 7px; border-radius: 16px; }
      .meeting-image { min-height: 230px; border-radius: 11px; }
      .meeting-caption { align-items: flex-start; flex-direction: column; gap: 7px; }
    }
  </style>
</head>

<body>
  <main class="meeting-page">
    <div class="topbar">
      <a class="back-button" href="blogdetails.html" aria-label="Go back to meetings">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
      </a>

      <section class="course-summary" aria-labelledby="course-title">
        <div class="course-heading-row">
          <div>
            <h1 class="course-title" id="course-title">UX/UI Design Conference Meeting</h1>
            <ul class="course-meta">
              <li><i class="bi bi-journal-play" aria-hidden="true"></i> 9 Lessons</li>
              <li><i class="bi bi-clock" aria-hidden="true"></i> 6h 30min</li>
            </ul>
          </div>
          <button class="settings-button" type="button" aria-label="Meeting settings">
            <i class="bi bi-gear" aria-hidden="true"></i>
          </button>
        </div>
      </section>
    </div>

    <section class="meeting-frame" aria-label="Conference meeting display">
      <img
        class="meeting-image"
        src="images/online meet.jpg"
        alt="UX and UI design online conference meeting"
      >
      <div class="meeting-caption">
        <p class="caption-title">UX/UI Design Conference</p>
        <span class="live-status"><span class="live-dot" aria-hidden="true"></span> Meeting room</span>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
'''
